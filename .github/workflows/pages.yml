# Publishes the site twice from one repository (12 Nov): the stable page from
# `main` at the root, for anyone the owner sends the link to, and the work in
# progress from `testing` under /testing/, for the owner to try before it is
# promoted. Pages serves one artifact, so every push to either branch lays out
# both and publishes them together. The page is one self-contained file, so
# nothing is built: the two trees are copied into place. The testing page
# keeps its browser storage under its own prefix (the top of scope.html's
# script says why). Needs Settings > Pages > Source set to "GitHub Actions".
name: Publish the site

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The quick checks (17 Nov, the owner's): what can be got wrong in a commit
  # and found in seconds, with no browser and no wasm32 toolchain, run on the
  # commit pushed; the site is not published unless they pass. They are not
  # the suites - those take an hour and a browser, and are run before a push
  # (CLAUDE.md) - but each catches a mistake that has shipped or nearly has:
  # a syntax error in the one-file page, which is found by a blank page; the
  # setup's schema or the info line's words edited on one side only; a colour
  # token outside DESIGN.md's tables; and the core changed and not built
  # again into the page (build.py --sources reads a hash the build records,
  # so it needs no compiler). A push to either branch publishes both, and
  # this checks the branch pushed: the other passed when it was pushed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: The page's script parses
        run: python3 web/extract.py && node --check web/tests/check.js
      - name: The core's schema is the page's SETUP_FIELDS
        run: python3 core/tests/tools/write_schema.py --check
      - name: The info line's words are the doc's
        run: python3 web/tools/write_words.py --check
      - name: Every colour is in DESIGN.md's tables
        run: python3 web/tests/designtest.py
      - name: The page's compiled core was built from core/ as it is
        run: python3 core/wasm/build.py --sources

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v5
        with:
          ref: testing
          path: testing
      - name: Lay out the stable site at the root and the testing site under /testing/
        run: |
          mkdir -p site/testing
          cp stable/index.html site/
          cp -r stable/web site/web
          cp testing/index.html site/testing/
          cp -r testing/web site/testing/web
          # The suites are not part of the site.
          rm -rf site/web/tests site/testing/web/tests
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
